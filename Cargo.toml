[package]
name = "sootmark-filehistory"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Windows File History catalogs (Catalog1.edb, Catalog2.edb) for forensics: every file and folder backed up, with its path, times, attributes and USN, and the backup sets, read with sootmark-ese."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/filehistory"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "windows", "backup"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "filehistory"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }
ese = { package = "sootmark-ese", version = "0.1.1" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

# The damage tests read the 3 MB catalog many times: an optimised inflater
# and reader keep the test run short.
[profile.dev.package.sootmark-common]
opt-level = 3
[profile.dev.package.sootmark-ese]
opt-level = 3
